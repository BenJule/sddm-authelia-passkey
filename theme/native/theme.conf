[General]

# v1.9.0 Native Theme Foundation ships no configuration keys yet -
# every foundation behaviour (password login, session selection,
# power actions, keyboard-layout affordance) comes from the SDDM
# context APIs directly and needs no theme.conf setting.
#
# Native branding configuration (equivalent to the v1.8.0
# compatibility-theme ui_brand_* keys) is deferred to v1.13.0 - see
# NATIVE-THEME-ROADMAP.md. This file exists now so the theme's
# ConfigFile/admin-override mechanism (theme.conf.user) is already in
# place before that work starts.
