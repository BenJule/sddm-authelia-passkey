[General]

# v1.13 Native Theme branding.
#
# These settings are presentation-only. Authentication and policy remain
# exclusively in /etc/sddm-authelia-passkey/config.conf.
#
# Leave defaults unchanged for the exact v1.12 appearance.

ui_brand_name=
ui_brand_logo=

ui_show_hostname=false

ui_show_domain=false
ui_brand_domain=

ui_show_avatar=true

# system preserves the Native Theme default accent.
# custom requires an opaque #RRGGBB value in ui_accent_color.
ui_accent=system
ui_accent_color=
