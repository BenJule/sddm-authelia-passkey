name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest an improvement. Please describe the user problem first, then the proposed solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation are you trying to solve?
      placeholder: Describe the current limitation and who it affects.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What behaviour would you like to see?
      placeholder: Describe the desired behaviour, UX or integration.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication / PAM
        - OIDC / provider integration
        - Identity / NSS / SSSD
        - Native Theme / UX
        - KWallet
        - FIDO2 / U2F
        - Packaging / installation
        - CI / release / supply chain
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: Security or trust-boundary impact
      description: If the proposal changes authentication, identity binding, PAM, secrets, markers or recovery behaviour, explain the expected impact. Write "none" if not applicable.
      placeholder: none
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. What other approaches or workarounds have you considered?

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I checked the existing issues and roadmap for a similar request.
          required: true
        - label: I have not included secrets, tokens, credentials or private keys.
          required: true
