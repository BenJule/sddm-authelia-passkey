name: scorecard

on:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e
        with:
          results_file: scorecard.json
          results_format: json
          publish_results: false

      - name: Add score to job summary
        shell: bash
        run: |
          score="$(python3 - <<'PY'
          import json
          with open('scorecard.json', encoding='utf-8') as f:
              data = json.load(f)
          print(data.get('score', 'unknown'))
          PY
          )"
          printf '## OpenSSF Scorecard\n\nOverall score: **%s / 10**\n' "$score" >> "$GITHUB_STEP_SUMMARY"
