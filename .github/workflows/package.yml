name: package

on:
  push:
    branches: [main]
  pull_request:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-and-lintian:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts golang-go gcc libpam0g-dev \
            lintian git ca-certificates

      - name: Credstore permission regression
        run: bash tests/integration/credstore-dir-test.sh

      - name: PAM backup regression
        run: bash tests/integration/pam-backup-test.sh

      - name: FIDO2 authfile regression
        run: bash tests/integration/fido2-authfile-test.sh

      - name: FIDO2 PAM stacking structure regression
        run: bash tests/integration/fido2-pam-integration-test.sh

      - name: PAM disable structure regression
        run: bash tests/integration/pam-disable-structure-test.sh

      - name: Break-glass transform regression
        run: bash tests/integration/break-glass-test.sh

      - name: Theme mode regression
        run: bash tests/integration/theme-mode-test.sh

      - name: Theme mode command contract regression
        run: bash tests/integration/theme-mode-command-test.sh

      - name: Shellcheck all shipped scripts
        run: |
          apt-get install -y --no-install-recommends shellcheck
          shellcheck --severity=warning scripts/*.sh scripts/lib/*.sh tests/*.sh tests/integration/*.sh

      - name: bash -n syntax check all shipped scripts
        run: |
          for f in scripts/*.sh scripts/lib/*.sh tests/*.sh tests/integration/*.sh; do
            bash -n "$f"
          done

      - name: Systemd upgrade lifecycle policy regression
        run: |
          grep -Fq 'dh_installsystemd --no-enable --no-start --no-stop-on-upgrade' debian/rules
          COUNT="$(grep -Fc 'dh_installsystemd ' debian/rules)"
          test "$COUNT" -eq 1

      - name: Build package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect build output
        run: |
          mkdir -p out
          mv ../sddm-authelia-passkey_*.deb \
             ../sddm-authelia-passkey_*.changes \
             ../sddm-authelia-passkey_*.buildinfo out/

      - name: Verify package metadata
        run: |
          dpkg-deb -I out/sddm-authelia-passkey_*.deb
          dpkg-deb -c out/sddm-authelia-passkey_*.deb
          dpkg-deb -c out/sddm-authelia-passkey_*.deb | grep -q '/usr/share/sddm-authelia-passkey/install-theme.sh'
          dpkg-deb -c out/sddm-authelia-passkey_*.deb | grep -q '/usr/share/sddm-authelia-passkey/theme-mode.sh'
          dpkg-deb -c out/sddm-authelia-passkey_*.deb | grep -q '/usr/share/sddm-authelia-passkey/theme/Main.qml.patch'
          dpkg-deb -c out/sddm-authelia-passkey_*.deb | grep -q '/usr/share/sddm-authelia-passkey/theme/metadata.desktop.patch'
          dpkg-deb -c out/sddm-authelia-passkey_*.deb | grep -q '/usr/share/sddm-authelia-passkey/disable-pam.sh'
          dpkg-deb -c out/sddm-authelia-passkey_*.deb | grep -q '/usr/share/sddm-authelia-passkey/break-glass.sh'
          dpkg-deb -c out/sddm-authelia-passkey_*.deb | grep -q '/usr/sbin/sddm-authelia-passkey-admin'

      - name: lintian
        run: lintian --fail-on error,warning out/sddm-authelia-passkey_*.deb

      - uses: actions/upload-artifact@v7
        with:
          name: deb-package
          path: out/sddm-authelia-passkey_*.deb
          retention-days: 7

  upgrade:
    runs-on: ubuntu-latest
    needs: build-and-lintian
    container: debian:13
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: /tmp/pkg

      - name: Install pristine Breeze baseline + curl
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sddm-theme-debian-breeze patch curl ca-certificates

      - name: Install the previous published release (v0.7.0)
        run: |
          curl -fsSL -o /tmp/prev.deb \
            https://github.com/BenJule/sddm-authelia-passkey/releases/download/v0.7.0/sddm-authelia-passkey_0.7.0-1_amd64.deb
          apt-get install -y --no-install-recommends /tmp/prev.deb

      - name: Configure and integrate PAM as an admin would have, on that older version
        run: |
          # Pre-v0.5.0-shaped config.conf on purpose (matches
          # TestLoadConfig_PreV050ConfigStillLoadsWithNewDefaults in
          # src/broker/config_test.go) - proves an admin's untouched,
          # years-old config.conf survives an in-place upgrade.
          cat > /etc/sddm-authelia-passkey/config.conf <<'EOF'
          authelia_base_url=https://idp.example.com
          allowed_verification_host=idp.example.com
          oidc_client_id=pam-authelia
          allowed_users=alice,bob
          approval_ttl_seconds=45
          EOF
          sed -i 's/^ *//' /etc/sddm-authelia-passkey/config.conf
          /usr/share/sddm-authelia-passkey/enable-pam.sh
          sha256sum /etc/pam.d/sddm > /tmp/pam-before-upgrade.sha256
          sha256sum /etc/sddm-authelia-passkey/config.conf > /tmp/config-before-upgrade.sha256
          dpkg -l sddm-authelia-passkey | grep ^ii

      - name: Upgrade in place to the newly-built package
        run: apt-get install -y --no-install-recommends /tmp/pkg/sddm-authelia-passkey_*.deb

      - name: Verify upgrade did not touch PAM or the existing config.conf
        run: |
          EXPECTED_VERSION="$(dpkg-deb -f /tmp/pkg/sddm-authelia-passkey_*.deb Version)"
          INSTALLED_VERSION="$(dpkg-query -W -f='${Version}' sddm-authelia-passkey)"
          [ "$INSTALLED_VERSION" = "$EXPECTED_VERSION" ]
          [ "$INSTALLED_VERSION" != "0.7.0-1" ]
          sha256sum -c /tmp/pam-before-upgrade.sha256
          sha256sum -c /tmp/config-before-upgrade.sha256
          grep -q pam_authelia_passkey.so /etc/pam.d/sddm

      - name: Verify the new admin CLI accepts the preserved old-shaped config
        run: /usr/sbin/sddm-authelia-passkey-admin test-config | grep -q CONFIG_VALID

      - name: Verify new scripts are present after upgrade
        run: |
          test -x /usr/share/sddm-authelia-passkey/disable-pam.sh
          test -x /usr/share/sddm-authelia-passkey/break-glass.sh

  lifecycle:
    runs-on: ubuntu-latest
    needs: build-and-lintian
    container: debian:13
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: /tmp/pkg

      - name: Install pristine Breeze baseline
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sddm-theme-debian-breeze patch
          sha256sum \
            /usr/share/sddm/themes/debian-breeze/Main.qml \
            /usr/share/sddm/themes/debian-breeze/metadata.desktop \
            > /tmp/breeze-before.sha256

      - name: Install package
        run: apt-get install -y --no-install-recommends /tmp/pkg/sddm-authelia-passkey_*.deb

      - name: Verify package and generated theme
        run: |
          test -f /usr/lib/sddm-authelia-passkey/broker
          test -f /usr/lib/sddm-authelia-passkey/kwallet-secretd
          test -f /usr/lib/x86_64-linux-gnu/security/pam_authelia_passkey.so
          test -x /usr/share/sddm-authelia-passkey/install-theme.sh
          test -x /usr/share/sddm-authelia-passkey/theme-mode.sh
          test -x /usr/share/sddm-authelia-passkey/disable-pam.sh
          test -x /usr/share/sddm-authelia-passkey/break-glass.sh
          test -x /usr/sbin/sddm-authelia-passkey-admin
          test -f /usr/share/sddm/themes/debian-breeze-authelia-passkey/Main.qml
          grep -q targetUsername /usr/share/sddm/themes/debian-breeze-authelia-passkey/Main.qml
          grep -q sddmSelectedUsername /usr/share/sddm/themes/debian-breeze-authelia-passkey/Main.qml
          dpkg -V sddm-authelia-passkey
          sha256sum -c /tmp/breeze-before.sha256
          dpkg -V sddm-theme-debian-breeze

      - name: admin CLI test-config - fails closed with no config present yet
        run: |
          if /usr/sbin/sddm-authelia-passkey-admin test-config; then
            echo "FAIL: test-config succeeded with no /etc/sddm-authelia-passkey/config.conf present"
            exit 1
          fi

      - name: admin CLI test-config - succeeds once a valid config is in place
        run: |
          cp /etc/sddm-authelia-passkey/config.conf.example /etc/sddm-authelia-passkey/config.conf
          /usr/sbin/sddm-authelia-passkey-admin test-config | grep -q CONFIG_VALID
          rm -f /etc/sddm-authelia-passkey/config.conf

      - name: Theme installer idempotency
        run: |
          T=/usr/share/sddm/themes/debian-breeze-authelia-passkey/Main.qml
          BEFORE="$(sha256sum "$T" | awk '{print $1}')"
          /usr/share/sddm-authelia-passkey/install-theme.sh
          AFTER="$(sha256sum "$T" | awk '{print $1}')"
          test "$BEFORE" = "$AFTER"
          sha256sum -c /tmp/breeze-before.sha256
          dpkg -V sddm-theme-debian-breeze

      - name: Theme mode lifecycle and package-reinstall preservation
        run: |
          ADMIN=/usr/sbin/sddm-authelia-passkey-admin
          PKG=/tmp/pkg/sddm-authelia-passkey_*.deb

          $ADMIN mode-status | grep -q '^INSTALL_MODE=backend-only$'
          $ADMIN mode-status | grep -q '^THEME_SELECTION_MANAGED=NO$'

          cat > /etc/sddm.conf <<'EOF'
          [Theme]
          Current=debian-breeze
          EOF
          sed -i 's/^ *//' /etc/sddm.conf
          chmod 0640 /etc/sddm.conf

          sha256sum /etc/sddm.conf > /tmp/sddm-before-mode.sha256
          BASE_MODE="$(stat -c '%a' /etc/sddm.conf)"

          $ADMIN apply-mode native | grep -q '^MODE_APPLY=GREEN$'
          $ADMIN mode-status | grep -q '^INSTALL_MODE=native$'
          grep -q '^Current=sddm-authelia-passkey-native$' /etc/sddm.conf

          apt-get install --reinstall -y --no-install-recommends $PKG
          $ADMIN mode-status | grep -q '^INSTALL_MODE=native$'
          $ADMIN mode-status | grep -q '^EFFECTIVE_THEME=sddm-authelia-passkey-native$'

          $ADMIN apply-mode compatibility | grep -q '^MODE_APPLY=GREEN$'
          $ADMIN mode-status | grep -q '^INSTALL_MODE=compatibility$'

          apt-get install --reinstall -y --no-install-recommends $PKG
          $ADMIN mode-status | grep -q '^INSTALL_MODE=compatibility$'
          $ADMIN mode-status | grep -q '^EFFECTIVE_THEME=debian-breeze-authelia-passkey$'

          $ADMIN apply-mode backend-only | grep -q '^MODE_APPLY=GREEN$'
          $ADMIN mode-status | grep -q '^INSTALL_MODE=backend-only$'
          $ADMIN mode-status | grep -q '^THEME_SELECTION_MANAGED=NO$'

          sha256sum -c /tmp/sddm-before-mode.sha256
          test "$(stat -c '%a' /etc/sddm.conf)" = "$BASE_MODE"
          grep -q '^Current=debian-breeze$' /etc/sddm.conf

          echo "THEME_MODE_PACKAGE_LIFECYCLE=GREEN"

      - name: Invariant - plain install must not touch PAM
        run: |
          if [ -f /etc/pam.d/sddm ] && grep -q pam_authelia_passkey /etc/pam.d/sddm; then
            echo "FAIL: package install silently modified /etc/pam.d/sddm"
            exit 1
          fi
          echo "OK: PAM untouched by plain package install"

      - name: Remove package
        run: apt-get remove -y sddm-authelia-passkey

      - name: Verify cleanup
        run: |
          test ! -f /usr/lib/sddm-authelia-passkey/broker
          test ! -f /usr/lib/x86_64-linux-gnu/security/pam_authelia_passkey.so
          test ! -e /usr/share/sddm/themes/debian-breeze-authelia-passkey
          test ! -e /usr/sbin/sddm-authelia-passkey-admin
          test ! -e /usr/share/sddm-authelia-passkey/disable-pam.sh
          test ! -e /usr/share/sddm-authelia-passkey/break-glass.sh
          sha256sum -c /tmp/breeze-before.sha256
          dpkg -V sddm-theme-debian-breeze

      - name: Reinstall package
        run: apt-get install -y --no-install-recommends /tmp/pkg/sddm-authelia-passkey_*.deb

      - name: Verify reinstall
        run: |
          dpkg -V sddm-authelia-passkey
          test -f /usr/share/sddm/themes/debian-breeze-authelia-passkey/Main.qml
          grep -q targetUsername /usr/share/sddm/themes/debian-breeze-authelia-passkey/Main.qml
          sha256sum -c /tmp/breeze-before.sha256
          dpkg -V sddm-theme-debian-breeze
