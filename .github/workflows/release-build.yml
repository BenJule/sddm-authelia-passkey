name: release-build

# Builds release-candidate artifacts (deterministically, in a clean
# Debian 13 container) for the maintainer to download, inspect, sign,
# and upload manually - see docs/release-signing.md. Deliberately does
# NOT sign anything or create/publish a GitHub release itself: doing
# that in CI would require putting the maintainer's private GPG key into
# a long-lived repository secret, which is a strictly worse trust
# boundary than the current manual process. Security beats automation.

on:
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts golang-go gcc libpam0g-dev \
            lintian git ca-certificates

      - name: Trust the checkout dir (container UID != checkout owner, needed for cyclonedx-gomod's git calls)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect build output (upload-artifact rejects ../ paths)
        run: mkdir -p out && mv ../sddm-authelia-passkey_*.deb ../sddm-authelia-passkey_*.changes ../sddm-authelia-passkey_*.buildinfo out/

      - name: lintian
        run: lintian --fail-on error,warning out/sddm-authelia-passkey_*.deb

      - name: Diagnose git state before SBOM generation
        run: |
          echo "pwd: $(pwd)"
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          ls -la .git || echo ".git MISSING"
          git config --global --get-all safe.directory || echo "no safe.directory entries"
          git -C src/broker rev-parse --show-toplevel || echo "git rev-parse FAILED from src/broker"
          git -C src/broker status || echo "git status FAILED from src/broker"

      - name: Generate SBOMs (CycloneDX, per Go module)
        run: |
          cd src/broker && go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest app -json -output ../../out/broker.cdx.json
          cd ../kwallet-secretd && go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest app -json -output ../../out/kwallet-secretd.cdx.json

      - name: Checksums (unsigned - maintainer signs these locally)
        run: cd out && sha256sum sddm-authelia-passkey_*.deb sddm-authelia-passkey_*.changes sddm-authelia-passkey_*.buildinfo > SHA256SUMS.unsigned

      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: out/
          retention-days: 14
